name: Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "packages/**"
      - "scripts/**"
      - "bin/**"
      - "bootstrap.sh"
      - "install.sh"
      - "justfile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell entrypoints
        run: |
          shellcheck bootstrap.sh install.sh bin/dotfiles scripts/authenticate-private scripts/package-plan
          bash scripts/package-plan --role development --json | python3 -m json.tool >/dev/null
      - name: Verify generated site data
        run: |
          for plan in development desktop server remote mobile linux termux macos; do
            test -s "docs/data/$plan.json"
            python3 -m json.tool "docs/data/$plan.json" >/dev/null
          done
          node --check docs/app.js
          grep -Fq 'bash -s --' docs/index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
