name: Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "packages/**"
      - "scripts/**"
      - "bin/**"
      - "bootstrap.sh"
      - "install.sh"
      - "justfile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell entrypoints
        run: |
          shellcheck bootstrap.sh install.sh bin/dotfiles scripts/authenticate-private scripts/package-plan
          bash scripts/package-plan --role development --json | python3 -m json.tool >/dev/null
      - name: Verify generated site data
        run: |
          for plan in base development desktop server remote mobile linux termux macos; do
            test -s "docs/data/$plan.json"
            python3 -m json.tool "docs/data/$plan.json" >/dev/null
          done
          python3 -m json.tool docs/package-details.json >/dev/null
          for locale in en es sv; do
            python3 -m json.tool "docs/locales/$locale.json" >/dev/null
          done
          node --check docs/app.js
          node - <<'NODE'
          const fs = require('fs');
          const details = JSON.parse(fs.readFileSync('docs/package-details.json', 'utf8')).packages;
          const locales = Object.fromEntries(['en','es','sv'].map(name => [
            name,
            JSON.parse(fs.readFileSync(`docs/locales/${name}.json`, 'utf8'))
          ]));
          const plans = ['base','development','desktop','server','remote','mobile','linux','termux','macos']
            .map(name => JSON.parse(fs.readFileSync(`docs/data/${name}.json`, 'utf8')));
          const names = new Set(plans.flatMap(plan => plan.packages.map(pkg => pkg.name)));
          const missing = [...names].filter(name => !details[name]);
          if (missing.length) throw new Error(`Missing package details: ${missing.join(', ')}`);
          for (const language of ['es','sv']) {
            const untranslated = [...names].filter(name => !locales[language].packages?.[name]?.summary || !locales[language].packages?.[name]?.why);
            if (untranslated.length) throw new Error(`Missing ${language} package translations: ${untranslated.join(', ')}`);
          }
          for (const language of ['en','es','sv']) {
            for (const key of ['ui','platforms','roles','catalogLayers']) {
              if (!locales[language][key]) throw new Error(`Missing ${language} locale section: ${key}`);
            }
          }
          NODE
          grep -Fq 'bash -s --' docs/index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
